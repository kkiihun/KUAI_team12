<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141714">
  <meta name="description" content="PILK — Picture It Like Korean. 실시간 한국식 AR 포토 코칭 & 배경 인식 주변 핫플 추천.">
  <title>PILK — Picture It Like Korean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header class="app-bar">
  <a href="#director" class="brand" aria-label="PILK">
    <span class="brand-mark">✳</span>
    <span class="brand-name">PILK</span>
    <span class="brand-tag" data-t="tagline"></span>
  </a>
  <div class="bar-right">
    <div class="lang-pill" role="group" aria-label="Language">
      <button type="button" id="lang-ko" class="selected" aria-pressed="true">KR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
      <button type="button" id="lang-ja" aria-pressed="false">JP</button>
    </div>
    <button type="button" class="icon-badge-btn" id="openSaved" aria-label="Saved">
      <span data-icon="bookmark"></span>
      <span class="count-dot" id="saveCount">0</span>
    </button>
  </div>
</header>

<main class="app-main">
  <!-- CAMERA-FIRST WORKSPACE -->
  <section class="studio-wrap" id="director">
    <!-- LEFT / TOP: VIEWFINDER + ATTACHED SHUTTER BAR -->
    <div class="camera-shell">
      <div class="viewfinder" id="viewfinderStage">
        <img id="stageBgImg" src="assets/places/seongsu.jpg" alt="Scene">
        <video id="stageVideo" autoplay playsinline muted></video>

        <div class="vf-grid" id="vfGrid"></div>
        <div class="vf-foot-line" id="vfFootLine"><span>FOOT LINE</span></div>
        <div class="vf-overlay" id="vfOverlay"></div>
        <div class="vf-scan-laser hidden" id="vfScanLaser"></div>

        <!-- Minimal Top Overlay -->
        <div class="vf-top">
          <div class="vf-top-left">
            <span class="match-pill" id="vfMatchPill"><strong id="vfMatchScore">96%</strong></span>
            <button type="button" class="spot-pill" id="vfSpotPill">📍 <span id="vfSpotName">성수 연무장길</span></button>
          </div>
          <div class="vf-top-right">
            <span class="tilt-pill" id="vfTiltReadout">0°</span>
            <button type="button" class="glass-icon-btn" id="helperModeBtn" aria-label="10s Helper Card">👥</button>
            <button type="button" class="glass-icon-btn" id="toggleSettingsBtn" aria-label="Settings">⚙️</button>
          </div>
        </div>

        <!-- Mode B: Ultra-short 3-pill strip (visible only in Mode B) -->
        <div class="vf-steps hidden" id="vfModeBStrip"></div>

        <!-- Single-Line Live Coaching Cue -->
        <div class="vf-cue" id="vfDirectiveBar">
          <p id="vfDirText"></p>
        </div>

        <!-- 10s Helper Mode Full Overlay -->
        <div class="vf-helper hidden" id="vfHelperCard">
          <span class="helper-chip">PILK · 10s GUIDE</span>
          <h3 data-t="helperTitle"></h3>
          <div class="helper-box" id="vfHelperSteps"></div>
          <button type="button" class="btn primary" id="closeHelperBtn" data-t="helperClose"></button>
        </div>
      </div>

      <!-- Native-style Shutter Bar -->
      <div class="shutter-bar">
        <label class="shutter-side-btn" for="uploadSceneInput">
          <span data-icon="upload"></span><small data-t="dockPhoto"></small>
        </label>
        <input type="file" id="uploadSceneInput" accept="image/jpeg,image/png,image/webp" class="sr-only">

        <button type="button" class="shutter-side-btn" id="toggleCamBtn">
          <span data-icon="camera"></span><small id="toggleCamLabel" data-t="dockCamOn"></small>
        </button>

        <button type="button" class="shutter-circle" id="shutterBtn" aria-label="Snap Photo"><span></span></button>

        <button type="button" class="shutter-side-btn" id="exportStoryBtn">
          <span data-icon="spark"></span><small data-t="dockStory"></small>
        </button>

        <button type="button" class="shutter-side-btn" id="speakCueBtn">
          <span data-icon="volume"></span><small data-t="dockVoice"></small>
        </button>
      </div>
    </div>

    <!-- RIGHT / BELOW: COMPACT PILLS + AI NEARBY CAROUSEL -->
    <div class="controls-col">
      <!-- Compact Control Strip -->
      <div class="compact-card">
        <!-- Row 1: Mode Segmented + Quick Toggles -->
        <div class="seg-row">
          <div class="seg-group" role="tablist">
            <button type="button" class="seg-btn selected" data-mode="A" data-t="modeA"></button>
            <button type="button" class="seg-btn" data-mode="B" data-t="modeB"></button>
            <button type="button" class="seg-btn" data-mode="C" data-t="modeC"></button>
          </div>
          <div class="lens-seg" role="group" aria-label="Lens">
            <button type="button" class="lens-btn" data-lens="0.5×">0.5×</button>
            <button type="button" class="lens-btn selected" data-lens="1×">1×</button>
            <button type="button" class="lens-btn" data-lens="2×">2×</button>
          </div>
        </div>

        <!-- Row 2: Swipeable Korean Framing Switches (Flip / Front Foot / Distance) -->
        <div class="pill-scroll">
          <button type="button" class="ctrl-pill active" id="btnFlip180">🔄 <span data-t="flipBtn"></span></button>
          <button type="button" class="ctrl-pill active" id="btnFrontFoot">🦶 <span data-t="footBtn"></span></button>
          <span class="pill-divider" aria-hidden="true"></span>
          <button type="button" class="dist-pill" data-dist="-1" data-t="distClose"></button>
          <button type="button" class="dist-pill selected" data-dist="0" data-t="distBest"></button>
          <button type="button" class="dist-pill" data-dist="1" data-t="distFar"></button>
        </div>

        <!-- Row 3: Swipeable 6 K-Pose Chips -->
        <div class="pill-scroll pose-strip" id="poseStrip"></div>

        <!-- Collapsible Settings (Hidden by default) -->
        <div class="settings-drawer hidden" id="settingsDrawer">
          <label class="drawer-range">
            <span data-t="opacityLabel"></span>
            <input type="range" id="opacitySlider" min="15" max="100" value="72">
            <b id="opacityVal">72%</b>
          </label>
          <label class="drawer-check">
            <input type="checkbox" id="gridToggle" checked>
            <span data-t="gridLabel"></span>
          </label>
        </div>
      </div>

      <!-- Compact AI Scene Scan & Horizontal Nearby Partner Carousel -->
      <div class="compact-card nearby-card" id="scanCard">
        <div class="nearby-head">
          <div class="nearby-title-wrap">
            <span class="ai-dot"></span>
            <strong id="scanSpotTitle">성수 연무장길</strong>
            <span class="light-tag" id="scanLightTag"></span>
          </div>
          <button type="button" class="scan-mini-btn" id="runScanBtn">
            <span data-icon="scan"></span><span data-t="scanBtn"></span>
          </button>
        </div>
        <div class="nearby-carousel" id="nearbyList"></div>
      </div>
    </div>
  </section>

  <!-- 44 SPOTS CLEAN PHOTO GRID -->
  <section class="spots-section" id="discover">
    <div class="spots-top-row">
      <h2 data-t="spotsTitle"></h2>
      <label class="search-mini">
        <span data-icon="search"></span>
        <input id="searchInput" type="search" data-placeholder="searchPlaceholder">
      </label>
    </div>

    <div class="pill-scroll filter-row">
      <button type="button" class="filter-chip selected" data-filter="all"><span data-t="filterAll"></span></button>
      <button type="button" class="filter-chip" data-filter="local"><span data-t="filterLocal"></span></button>
      <button type="button" class="filter-chip" data-filter="drama"><span data-t="filterDrama"></span></button>
      <button type="button" class="filter-chip" data-filter="heritage"><span data-t="filterHeritage"></span></button>
      <button type="button" class="filter-chip" data-filter="nature"><span data-t="filterNature"></span></button>
    </div>

    <div class="spot-grid" id="spotGrid"></div>
    <div class="more-wrap">
      <button type="button" class="btn outline sm" id="loadMoreBtn"></button>
    </div>
    <p class="empty-msg hidden" id="emptySearch" data-t="emptySearch"></p>
  </section>
</main>

<footer class="mini-footer">
  <span>✳ PILK v005</span>
  <div class="footer-btns">
    <button type="button" id="openStrategyModalBtn" data-t="footerStrategy"></button>
    <button type="button" id="openCreditsBtn" data-t="footerCredits"></button>
  </div>
</footer>

<nav class="mobile-nav" aria-label="Bottom Navigation">
  <a href="#director" class="active"><span data-icon="camera"></span><span data-t="navCam"></span></a>
  <button type="button" id="mobileScanBtn"><span data-icon="scan"></span><span data-t="navScan"></span></button>
  <a href="#discover"><span data-icon="search"></span><span data-t="navSpots"></span></a>
  <button type="button" id="mobileSavedBtn"><span data-icon="bookmark"></span><span data-t="navSaved"></span></button>
</nav>

<dialog id="modal">
  <button type="button" class="modal-close" id="closeModal" aria-label="Close">✕</button>
  <div id="modalContent"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="spots-data.js?v=3"></script>
<script src="pilk-data.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
