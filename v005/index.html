<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f7f2">
  <meta name="description" content="PILK (Picture It Like Korean) — 스마트폰 180° 뒤집기, 한 보 뒤로, 발끝 정렬, 앞발 빼기까지 실시간 AR·음성 코칭 및 배경 자동 인식 기반 주변 관광지·로컬 쿠폰 추천 포토 앱.">
  <title>PILK v005 — Picture It Like Korean · 실시간 한국식 포토 디렉터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <a href="#" class="brand" aria-label="PILK home">
    <span class="brand-mark">✳</span>
    <span class="brand-text">PILK<span class="brand-version">v005</span></span>
  </a>
  <nav class="desktop-nav" aria-label="Primary">
    <a href="#director" class="active" data-t="navDirector"></a>
    <a href="#compare" data-t="navCompare"></a>
    <a href="#discover" data-t="navDiscover"></a>
    <a href="#recipes" data-t="navRecipes"></a>
    <a href="#ecosystem" data-t="navEcosystem"></a>
    <a href="survey.html" class="nav-accent" data-t="navSurvey"></a>
  </nav>
  <div class="header-right">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" id="lang-ko" class="selected" aria-pressed="true">KR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
      <button type="button" id="lang-ja" aria-pressed="false">JP</button>
    </div>
    <button type="button" class="saved-btn" id="openSaved">
      <span data-icon="bookmark"></span>
      <span data-t="myFrames"></span>
      <span class="badge-count" id="saveCount">0</span>
    </button>
  </div>
</header>

<main>
  <!-- HERO INTRO -->
  <section class="hero-intro">
    <div class="hero-copy">
      <div class="eyebrow"><span class="dot-live"></span><span data-t="heroEyebrow"></span></div>
      <h1 data-t="heroTitle"></h1>
      <p class="hero-desc" data-t="heroDesc"></p>
      <div class="hero-pills">
        <span class="hero-pill" data-t="heroPitch1"></span>
        <span class="hero-pill" data-t="heroPitch2"></span>
        <span class="hero-pill" data-t="heroPitch3"></span>
      </div>
      <div class="hero-cta-row">
        <button type="button" class="btn primary" id="heroStartCamBtn">
          <span data-icon="camera"></span><span data-t="ctaStartCam"></span>
        </button>
        <button type="button" class="btn dark" id="heroScanBtn">
          <span data-icon="scan"></span><span data-t="ctaScanBg"></span>
        </button>
        <a class="btn outline" href="survey.html" data-t="ctaSurvey"></a>
      </div>
    </div>
  </section>

  <!-- CORE PRODUCT: LIVE PILK CAMERA DIRECTOR & AUTO BACKGROUND SCANNER -->
  <section class="director-section" id="director">
    <div class="director-grid">
      <!-- LEFT: DARK VIEWFINDER STAGE -->
      <div class="viewfinder-wrap">
        <div class="viewfinder-stage" id="viewfinderStage">
          <img id="stageBgImg" src="assets/places/seongsu.jpg" alt="Active Korean spot scene">
          <video id="stageVideo" autoplay playsinline muted></video>

          <!-- 3x3 Grid & Foot Align Line -->
          <div class="vf-grid" id="vfGrid"></div>
          <div class="vf-foot-line" id="vfFootLine">
            <span>▲ FOOT ALIGN LINE · 발끝을 여기에 맞추세요 ▲</span>
          </div>

          <!-- AR Pose Silhouette Overlay -->
          <div class="vf-overlay" id="vfOverlay"></div>

          <!-- AI Scan Laser Animation -->
          <div class="vf-scan-laser hidden" id="vfScanLaser"></div>

          <!-- Top HUD Bar -->
          <div class="vf-top-hud">
            <div class="vf-status-pill" id="vfStatusPill">
              <span class="pulse-dot"></span>
              <span id="vfStatusText" data-t="demoBadge"></span>
            </div>
            <div class="vf-match-pill" id="vfMatchPill">
              <small data-t="kMatchLabel"></small>
              <strong id="vfMatchScore">94%</strong>
            </div>
          </div>

          <!-- Active Camera Setting Chips -->
          <div class="vf-setting-chips">
            <span class="vf-chip" id="vfFlipChip">🔄 180° FLIP ON</span>
            <span class="vf-chip" id="vfLensChip">📐 1× LENS</span>
            <span class="vf-chip" id="vfFootChip">🦶 FRONT FOOT +</span>
          </div>

          <!-- Horizon / Gyro Level Indicator -->
          <div class="vf-leveler" id="vfLeveler" aria-hidden="true">
            <div class="vf-level-bar" id="vfLevelBar"></div>
            <span id="vfTiltReadout">0° LEVEL</span>
          </div>

          <!-- Live Micro-Directive Floating Banner -->
          <div class="vf-directive-bar" id="vfDirectiveBar">
            <span class="vf-dir-tag" id="vfDirTag">LIVE COACH</span>
            <p id="vfDirText"></p>
          </div>

          <!-- Mode B: Step Cards Overlay inside Viewfinder (visible in Mode B) -->
          <div class="vf-mode-b-strip hidden" id="vfModeBStrip"></div>

          <!-- Helper Mode (10-second big card for companion/stranger) -->
          <div class="vf-helper-card hidden" id="vfHelperCard">
            <div class="helper-badge">PILK · 10s PHOTOGRAPHER GUIDE</div>
            <h3 data-t="helperModeTitle"></h3>
            <div class="helper-steps" id="vfHelperSteps"></div>
            <button type="button" class="btn primary" id="closeHelperBtn" data-t="helperModeClose"></button>
          </div>
        </div>

        <!-- Viewfinder Bottom Dock -->
        <div class="vf-dock">
          <button type="button" class="dock-btn" id="toggleCamBtn">
            <span data-icon="camera"></span><span id="toggleCamLabel" data-t="connectCam"></span>
          </button>
          <label class="dock-btn" for="uploadSceneInput">
            <span data-icon="upload"></span><span data-t="uploadBgBtn"></span>
          </label>
          <input type="file" id="uploadSceneInput" accept="image/jpeg,image/png,image/webp" class="sr-only">
          <button type="button" class="shutter-btn" id="shutterBtn" aria-label="Capture photo">
            <span></span>
          </button>
          <button type="button" class="dock-btn" id="exportStoryBtn">
            <span data-icon="spark"></span><span data-t="snapStoryBtn"></span>
          </button>
          <button type="button" class="dock-btn accent" id="helperModeBtn">
            <span data-icon="users"></span><span data-t="helperModeBtn"></span>
          </button>
        </div>
        <p class="vf-privacy-note" id="camErrorMsg" role="status"></p>
      </div>

      <!-- RIGHT: CONTROLS + AUTO BACKGROUND RECOGNITION PANEL -->
      <div class="director-panel">
        <!-- Mode A / B / C Switcher (Never disconnects live camera!) -->
        <div class="panel-card">
          <div class="panel-header-row">
            <span class="eyebrow muted" data-t="studioEyebrow"></span>
            <button type="button" class="mini-btn" id="speakCueBtn" data-t="speakCueBtn"></button>
          </div>
          <div class="mode-tabs" role="tablist">
            <button type="button" class="mode-tab selected" data-mode="A" data-t="modeA"></button>
            <button type="button" class="mode-tab" data-mode="B" data-t="modeB"></button>
            <button type="button" class="mode-tab" data-mode="C" data-t="modeC"></button>
          </div>

          <!-- Quick Scene & Recipe Selectors -->
          <div class="control-row-2">
            <div class="field">
              <label for="quickSceneSelect" data-t="sceneSelectLabel"></label>
              <select id="quickSceneSelect"></select>
            </div>
            <div class="field">
              <label for="recipeSelect" data-t="poseSelectLabel"></label>
              <select id="recipeSelect"></select>
            </div>
          </div>

          <!-- Interactive Korean Framing Simulators (Mentor's Exact Micro-Directives!) -->
          <div class="sim-controls">
            <div class="sim-chip-row">
              <button type="button" class="toggle-chip active" id="btnFlip180">
                🔄 <span data-t="flipToggle"></span>
              </button>
              <button type="button" class="toggle-chip active" id="btnFrontFoot">
                🦶 <span data-t="frontFootToggle"></span>
              </button>
              <div class="lens-group" role="group" aria-label="Lens">
                <button type="button" class="lens-btn" data-lens="0.5×">0.5×</button>
                <button type="button" class="lens-btn selected" data-lens="1×">1×</button>
                <button type="button" class="lens-btn" data-lens="2×">2×</button>
              </div>
            </div>

            <div class="field">
              <div class="label-between">
                <label for="distSlider" data-t="distLabel"></label>
                <span class="dist-status" id="distStatusText"></span>
              </div>
              <input type="range" id="distSlider" min="-1" max="1" step="1" value="0">
              <div class="range-marks">
                <span>−1</span><span>0 (BEST)</span><span>+1</span>
              </div>
            </div>

            <div class="control-row-2 compact">
              <div class="field">
                <div class="label-between">
                  <label for="opacitySlider" data-t="opacityLabel"></label>
                  <span id="opacityVal">72%</span>
                </div>
                <input type="range" id="opacitySlider" min="15" max="100" value="72">
              </div>
              <label class="check-inline">
                <input type="checkbox" id="gridToggle" checked>
                <span data-t="gridLabel"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- AI BACKGROUND RECOGNITION -> NEARBY ATTRACTIONS & LOCAL PARTNER COUPONS -->
        <div class="panel-card scan-card" id="scanCard">
          <div class="scan-card-top">
            <div>
              <span class="scan-badge" id="scanBadge" data-t="scanDetectedBadge"></span>
              <h3 id="scanSpotTitle"></h3>
            </div>
            <button type="button" class="btn primary sm" id="runScanBtn">
              <span data-icon="scan"></span><span data-t="scanNowBtn"></span>
            </button>
          </div>
          <div class="scan-metrics" id="scanMetrics"></div>
          <div class="nearby-block">
            <h4 data-t="scanNearbyTitle"></h4>
            <div class="nearby-list" id="nearbyList"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- SECTION 2: BEFORE VS AFTER (WHY KOREAN PHOTO STYLE?) -->
  <section class="section" id="compare">
    <div class="section-head">
      <div>
        <div class="eyebrow muted" data-t="compareEyebrow"></div>
        <h2 data-t="compareTitle"></h2>
        <p data-t="compareDesc"></p>
      </div>
    </div>
    <div class="compare-grid" id="compareGrid"></div>
  </section>

  <!-- SECTION 3: K-ANGLE & POSE RECIPES -->
  <section class="section" id="recipes">
    <div class="section-head">
      <div>
        <div class="eyebrow muted" data-t="recipesEyebrow"></div>
        <h2 data-t="recipesTitle"></h2>
        <p data-t="recipesDesc"></p>
      </div>
    </div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </section>

  <!-- SECTION 4: 44 SCENE-SUPPORTED KOREAN SPOTS -->
  <section class="section" id="discover">
    <div class="section-head">
      <div>
        <div class="eyebrow muted" data-t="discoverEyebrow"></div>
        <h2 data-t="discoverTitle"></h2>
        <p data-t="discoverDesc"></p>
      </div>
      <p class="catalog-meta" id="catalogCount" aria-live="polite"></p>
    </div>

    <div class="filter-bar">
      <div class="filter-chips">
        <button type="button" class="chip selected" data-filter="all">✦ <span data-t="filterAll"></span></button>
        <button type="button" class="chip" data-filter="local"><span data-icon="spark"></span><span data-t="filterLocal"></span></button>
        <button type="button" class="chip" data-filter="drama"><span data-icon="film"></span><span data-t="filterDrama"></span></button>
        <button type="button" class="chip" data-filter="heritage"><span data-icon="palace"></span><span data-t="filterHeritage"></span></button>
        <button type="button" class="chip" data-filter="nature"><span data-icon="sun"></span><span data-t="filterNature"></span></button>
      </div>
      <label class="search-box">
        <span data-icon="search"></span>
        <input id="searchInput" type="search" data-placeholder="searchPlaceholder">
      </label>
    </div>

    <div class="spot-grid" id="spotGrid"></div>
    <div class="load-more-wrap">
      <button type="button" class="btn outline" id="loadMoreBtn"></button>
    </div>
    <div class="empty-state hidden" id="emptySearch" data-t="emptySearch"></div>
  </section>

  <!-- SECTION 5: MENTOR PIVOT & BUSINESS ECOSYSTEM -->
  <section class="section" id="ecosystem">
    <div class="eco-banner">
      <div class="eco-head">
        <div class="eyebrow"><span class="dot-live"></span><span data-t="ecoEyebrow"></span></div>
        <h2 data-t="ecoTitle"></h2>
        <p data-t="ecoDesc"></p>
      </div>
      <div class="eco-cards" id="ecoCards"></div>
      <div class="eco-actions">
        <button type="button" class="btn primary" id="openStrategyModalBtn" data-t="ecoBtnDoc"></button>
        <a class="btn outline" href="survey.html" data-t="ecoBtnSurvey"></a>
      </div>
    </div>
  </section>
</main>

<footer>
  <a class="brand" href="#"><span class="brand-mark">✳</span> PILK<span class="brand-version">v005</span></a>
  <span class="footer-note" data-t="footerLine"></span>
  <div class="footer-links">
    <a href="survey.html" data-t="navSurvey"></a>
    <button type="button" id="openCreditsBtn" data-t="creditsBtn"></button>
    <span>© 2026 PILK · KUAI Team 12</span>
  </div>
</footer>

<nav class="mobile-nav" aria-label="Mobile Navigation">
  <a href="#director"><span data-icon="camera"></span><span>PILK</span></a>
  <a href="#discover"><span data-icon="search"></span><span data-t="filterAll"></span></a>
  <button type="button" id="mobileScanBtn" class="mobile-cta"><span data-icon="scan"></span><span>SCAN</span></button>
  <a href="#recipes"><span data-icon="spark"></span><span>K-POSE</span></a>
  <a href="survey.html"><span data-icon="check"></span><span>SURVEY</span></a>
</nav>

<dialog id="modal">
  <button type="button" class="modal-close" id="closeModal" aria-label="Close">✕</button>
  <div id="modalContent"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="spots-data.js"></script>
<script src="pilk-data.js"></script>
<script src="app.js"></script>
</body>
</html>
