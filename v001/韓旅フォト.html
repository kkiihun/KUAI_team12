<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>韓旅フォト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 丹青（タンチョン）の配色：深緑・朱・藍・金を、韓紙のような明るい地に置く。モバイル1カラムのアプリ。 */
:root{
  --paper:#F4F1EA; --card:#FFFFFF; --ink:#1C2230; --muted:#656A75; --line:#E2DDD2;
  --jade:#1E6B5B; --jade-soft:#DDEBE6; --red:#C8412F; --red-soft:#F7E2DC; --indigo:#26336A; --gold:#C99A2E;
  --display:'Shippori Mincho B1','Hiragino Mincho ProN',serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100%;padding-bottom:96px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--muted);line-height:1.2}
.mark{width:30px;height:30px;border-radius:8px;background:var(--indigo);display:grid;place-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;background:#fff;padding:2px}
.lang button{border:0;background:none;font-size:12px;padding:4px 10px;border-radius:999px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff;font-weight:700}
.lang-ko .alt{display:none}
main{padding:0 16px}
h1,h2,h3{text-wrap:balance}
.page-title{font-family:var(--display);font-size:24px;margin:12px 0 2px}
.lead{color:var(--muted);margin:0 0 14px;font-size:14px}
.sec{font-family:var(--display);font-size:19px;margin:24px 0 10px}
.note{font-size:12px;color:var(--muted);margin:14px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--jade-soft);color:var(--jade);font-weight:500}
.tag.drama{background:var(--red-soft);color:var(--red)}
.tag.kp{background:#F6EBCB;color:#8A6510}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--jade);color:#fff;text-decoration:none;line-height:1.3}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
/* hero */
.hero{display:grid;grid-template-columns:1fr 112px;gap:12px;background:var(--indigo);color:#fff;border-radius:18px;padding:16px;margin-top:6px;overflow:hidden}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:8px}
.pick-badge{background:#F1D58A;color:var(--indigo);font-weight:800;font-size:17px;padding:6px 12px;border-radius:10px;letter-spacing:.02em;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pick-date{font-size:12px;color:#C9CFEA;font-weight:500}
.hero .pick-h{font-family:var(--display);font-size:17px;margin:0 0 4px;line-height:1.4;color:#fff}
.hero p{font-size:13px;margin:0 0 12px;color:#DCE0F0}
.hero .btn{background:#fff;color:var(--indigo)}
.hero-art svg{width:112px;height:150px;border-radius:12px;display:block}
/* spot list */
.list{display:grid;gap:10px}
.kpick-note{font-size:13px;margin:0 0 10px;padding:10px 12px;background:#fff;border-left:3px solid var(--gold);border-radius:8px}
.spot-card{display:grid;grid-template-columns:84px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;width:100%}
.spot-card svg{width:84px;height:112px;border-radius:10px;display:block}
.spot-card h3{margin:2px 0 0;font-size:16px}
.ko{color:var(--muted);font-size:12px;font-weight:500}
.spot-card .sub{font-size:12px;color:var(--muted);margin:0 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
/* spot detail */
.back{border:0;background:none;color:var(--jade);font-weight:700;padding:8px 0;cursor:pointer}
.detail-hero{position:relative}
.detail-hero svg{width:100%;aspect-ratio:1/1;border-radius:18px;display:block}
.tod{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.tod .chip{background:rgba(255,255,255,.88);border:0;font-size:12px;padding:5px 11px}
.tod .chip.on{background:var(--ink);color:#fff}
.title{font-family:var(--display);font-size:25px;margin:14px 0 0}
.area{font-size:13px;color:var(--muted);margin:0 0 8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.facts div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.facts dt{font-size:11px;color:var(--muted)}
.facts dd{margin:0;font-size:13px;font-weight:500}
.shot{display:grid;grid-template-columns:104px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.shot svg{width:104px;height:139px;border-radius:10px;display:block}
.shot h3{font-size:15px;margin:0 0 4px}
.shot p{font-size:13px;margin:6px 0 8px;color:#3A3F4B}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
/* hanbok studio */
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sopt{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;text-align:left;cursor:pointer}
.sopt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:#FAF8F3}
.sopt b{font-size:12.5px;display:block;line-height:1.35}
.sopt .dots{margin:5px 0 0;gap:3px}.sopt .dot{width:14px;height:14px}
.sub-lbl{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.or-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.season-name{font-family:var(--display);font-size:19px;display:block;margin:2px 0}
.src-tag{font-size:10px;background:var(--jade-soft);color:var(--jade);padding:1px 6px;border-radius:5px;margin-left:4px;letter-spacing:0}
.pc h3,.me h3{margin:0 0 4px;font-size:16px}
.me{margin-top:10px}.me p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.me-row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.me-face{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.crop{position:relative;width:260px;height:260px;margin:10px auto;border-radius:50%;overflow:hidden;background:#000;touch-action:none;cursor:grab}
#cropimg{position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none}
.crop-mask{position:absolute;inset:22px 52px 14px;border:2px dashed rgba(255,255,255,.85);border-radius:50%;pointer-events:none}
.pc p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.qnum{font-size:11px;letter-spacing:.1em;color:var(--jade);font-weight:700}
.answers{display:grid;gap:8px}
.answers .btn{justify-content:flex-start}
.season{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.season b{font-family:var(--display);font-size:19px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.studio{display:grid;gap:12px;margin-top:14px}
.hb-stage{background:radial-gradient(circle at 50% 30%,#fff 0,#EFEAE0 70%);border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;padding:12px;position:relative;overflow:hidden}
.hb-stage::before{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(30,107,91,.06) 46px 48px),linear-gradient(#E6E0D3,#DCD5C6)}
.hb-stage svg{width:190px;height:304px;position:relative}
.hb-label{position:absolute;top:10px;left:12px;font-size:11px;color:var(--muted);z-index:1}
.ctrl{display:grid;gap:6px}
.lbl{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.lbl em{font-style:normal;color:var(--ink);font-weight:500}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw .rec{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{font-size:13px}
.legend{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
.combos{display:grid;gap:8px}
.combo{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;width:100%}
.combo .dots{margin:0;flex:none}
.combo span{font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions .btn:first-child{grid-column:1/-1}
.shop{margin-top:14px;background:var(--indigo);color:#fff;border:0}
.shop .lbl{color:#F1D58A}
.ko-big{font-size:21px;font-weight:700;margin:6px 0 0;line-height:1.4}
.shop p{margin:2px 0}
.shop .combo-txt{font-size:12px;color:#CDD3EA;margin-top:8px}
/* poses */
.pose-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pose{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px}
.pose-ill{background:#F3EFE6;border-radius:10px;display:grid;place-items:center;padding:6px 0}
.pose-ill svg{width:100%;max-width:120px;height:auto;aspect-ratio:3/4}
.pose h3{margin:4px 0 0;font-size:15px}
.pose .src{font-size:11px;color:var(--gold);font-weight:700;margin:2px 0 0;line-height:1.4}
.tag.tech{background:#E6E8F3;color:var(--indigo)}
.pose .how{font-size:12px;color:#3A3F4B;margin:2px 0 4px;flex:1}
.pose .igl{font-size:12px;color:var(--red);font-weight:700;text-decoration:none}
.pose .btn{margin-top:4px}
/* my */
.phrase{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.phrase .k{font-weight:700;font-size:16px}
.phrase .r{font-size:11px;color:var(--jade)}
.phrase .j{font-size:12px;color:var(--muted)}
.saved{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.saved .card{padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.saved svg{width:70px;height:112px}
.saved .row{justify-content:center;margin:0;gap:4px}
.empty{font-size:13px;color:var(--muted)}
/* tabs */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font-size:11px;color:var(--muted);cursor:pointer;padding:4px}
nav.tabs button[aria-current="page"]{color:var(--jade);font-weight:700}
nav.tabs svg{width:22px;height:22px}
/* modals */
.modal{position:fixed;inset:0;background:rgba(12,14,20,.94);z-index:50;overflow:auto;color:#fff}
.modal[hidden]{display:none}
.modal .inner{max-width:460px;margin:0 auto;padding:14px 16px 28px}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.m-head strong{font-family:var(--display);font-size:18px}
.x{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.stage{position:relative;width:100%;aspect-ratio:3/4;background:#1A1D25;border-radius:16px;overflow:hidden;touch-action:none;user-select:none}
.stage video,.stage img.bg,.stage .bgsvg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .bgsvg svg{width:100%;height:100%;display:block}
.fall{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;padding:24px;font-size:13px;color:#C9CDD8}
#ov{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none}
#ov svg{display:block;width:100%;height:auto;pointer-events:none}
#ov.full{inset:0;transform:none;cursor:default;pointer-events:none}
#ov.full svg{height:100%}
.m-chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.m-chips .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.m-chips .chip.on{background:#fff;color:var(--ink)}
.sliders{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px;color:#C9CDD8;margin:8px 0}
input[type=range]{width:100%;accent-color:#F1D58A}
.cam-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cam-actions .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.hint{font-size:12px;color:#AEB3C0;margin:10px 0 0}
.pv svg{width:100%;aspect-ratio:3/4;border-radius:16px;display:block}
.res img{width:100%;border-radius:14px;display:block}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1D58A" stroke-width="2"><path d="M2 9 Q12 13 22 9 L18 5 H6Z"/><path d="M5 10v9M19 10v9M9 12v7M15 12v7M3 20h18"/></svg></span><span>韓旅フォト<small>KANTABI PHOTO · SEOUL</small></span></div>
    <div class="lang" id="langsw" role="group" aria-label="言語"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="メインメニュー"></nav>
<div class="modal" id="cam" hidden></div>
<div class="modal" id="pv" hidden></div>
<div class="modal" id="res" hidden></div>
<div class="modal" id="crop" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- helpers ---------- */
let uidN=0; const U=()=>'u'+(++uidN);
const $=s=>document.querySelector(s);
const svg=(inner,vb,attrs='')=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" ${attrs}>${inner}</svg>`;
const ig=t=>`https://www.instagram.com/explore/tags/${encodeURIComponent(t)}/`;
const store={get(k,d){try{const v=localStorage.getItem('kantabi_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('kantabi_'+k,JSON.stringify(v))}catch(e){}}};
function toast(s){const el=$('#toast');el.textContent=t(s);el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
const mirror=d=>d.replace(/(-?\d+\.?\d*),(-?\d+\.?\d*)/g,(m,x,y)=>`${200-x},${y}`);

/* ---------- data ---------- */
const C={ // hex, 韓国語の伝統色名, 日本語
  yeonbun:['#F3B5C3','연분홍','薄桃'], jindal:['#CF5B8C','진달래','つつじ色'], dahong:['#D9473A','다홍','紅（ダホン）'],
  salgu:['#F4B48A','살구색','杏色'], songhwa:['#EFD067','송화색','松花色'], yeondu:['#B6D47A','연두','若草色'],
  oksaek:['#A6D6CB','옥색','玉色'], haneul:['#A9C7E6','하늘색','空色'], bora:['#B49BD0','연보라','藤色'],
  jjok:['#2D4A8C','쪽빛','藍色'], nam:['#1E2756','남색','紺色'], jaju:['#74284F','자주','紫紺'],
  jinnok:['#2C5B47','진녹','深緑'], hwangto:['#B47E3C','황토','黄土色'], eunhoe:['#BFC2C8','은회색','銀鼠'],
  meok:['#2A2A2E','먹색','墨色'], so:['#F2EDE2','소색','生成り']
};
const SEASONS={
  spring:{short:'春タイプ',ja:'春タイプ（イエベ春）',note:'明るく温かみのある色で、肌がいきいき見えます。',colors:['salgu','songhwa','yeondu','dahong','oksaek','yeonbun'],combos:[['salgu','oksaek','dahong'],['songhwa','dahong','jjok'],['yeonbun','yeondu','dahong']]},
  summer:{short:'夏タイプ',ja:'夏タイプ（ブルベ夏）',note:'やわらかく涼しげなパステルが上品に映えます。',colors:['yeonbun','haneul','oksaek','bora','eunhoe','so'],combos:[['so','haneul','bora'],['yeonbun','bora','jjok'],['oksaek','yeonbun','eunhoe']]},
  autumn:{short:'秋タイプ',ja:'秋タイプ（イエベ秋）',note:'深みのある温かい色で、落ち着いた華やかさに。',colors:['hwangto','jinnok','dahong','songhwa','salgu','jaju'],combos:[['songhwa','jinnok','dahong'],['salgu','hwangto','jinnok'],['so','dahong','jinnok']]},
  winter:{short:'冬タイプ',ja:'冬タイプ（ブルベ冬）',note:'コントラストの強い、鮮やかな色が似合います。',colors:['jjok','nam','jindal','jaju','meok','so'],combos:[['so','jjok','jindal'],['jindal','nam','so'],['so','meok','jaju']]}
};
const QUIZ=[
  {q:'手首の内側の血管は何色に見えますか？',a:[['緑っぽい','w'],['青や紫っぽい','c'],['よくわからない','']]},
  {q:'似合うと言われるアクセサリーは？',a:[['ゴールド','w'],['シルバー','c'],['どちらも','']]},
  {q:'日焼けするとどうなりますか？',a:[['すぐ小麦色になる','w'],['赤くなって元に戻る','c'],['どちらとも言えない','']]},
  {q:'髪と瞳の色の印象は？',a:[['明るめ・やわらかい','l'],['黒くてはっきり','d']]},
  {q:'よく褒められる服の色は？',a:[['パステルや明るい色','l'],['濃い色・鮮やかな色','d']]}
];
const STYLES=[['trad','伝統（チョゴリ＋チマ）'],['dangui','王宮風（唐衣）'],['modern','モダン（膝丈）']];
const HAIRS=[['binyeo','かんざし（ピニョ）'],['daenggi','テンギ（リボン）'],['flower','花飾り'],['none','なし']];
const CATS=[['all','すべて'],['kpick','K-ピック'],['drama','ドラマロケ地'],['street','街歩き'],['palace','王宮']];
const TODS=[['morning','朝'],['day','昼'],['sunset','夕'],['night','夜']];

const SPOTS=[

'1人が真ん中に立ち、ほかの友だちが両側から走ってきて抱きつく瞬間を動画で。順番に主役を交代してつなげます。':'한 명이 가운데 서고 친구들이 양옆에서 달려와 안아주는 순간을 영상으로. 돌아가며 주인공을 바꿔 이어 붙여요.',
'タイプがわかっていれば選ぶだけ。わからなければ5つの質問で診断できます。':'타입을 알고 있다면 선택만, 모르면 질문 5개로 진단할 수 있어요.','タイプを選ぶ':'타입 선택하기','わからない人は':'잘 모르겠다면','やめる':'그만하기','選択を解除':'선택 해제','診断結果':'진단 결과','自分で選択':'직접 선택',
'K-ピック':'K-픽','観光地より、韓国の20〜30代が週末に実際に出かける場所。':'관광지보다, 한국 20~30대가 주말에 실제로 가는 곳.',

'ポップアップの聖地':'팝업의 성지','赤レンガ':'붉은 벽돌','聖水駅3番出口':'성수역 3번 출구','市民が選ぶ夜景':'시민이 뽑은 야경','城壁の夜道':'성곽 밤길','恵化駅から':'혜화역에서','漢江の夕日':'한강 노을','楊花大橋の夜景':'양화대교 야경','ピクニック':'피크닉','屋内庭園':'실내 정원','クイーンズ百貨店のモデル':'퀸즈백화점의 모델','雨の日もOK':'비 오는 날도 OK',
'『梨泰院クラス』に何度も登場した歩道橋。正面にNソウルタワー、足元には車のライトが流れ、夜にこそ映えるスポットです。':'〈이태원 클라쓰〉에 여러 번 나온 육교. 정면에 N서울타워, 발아래로 자동차 불빛이 흐르는 밤에 더 빛나는 스폿이에요.',
'日没後〜夜（車のライトがきれい）':'해 진 뒤~밤(자동차 불빛이 예뻐요)','6号線 緑莎坪駅1・3番出口からすぐ。通行の妨げにならないように':'6호선 녹사평역 1·3번 출구에서 바로. 통행에 방해되지 않게',
'タワーと車の光を背に':'타워와 자동차 불빛을 배경으로','1x・夜景モード':'1x·야경 모드','欄干を背に、タワーが頭の横に来る位置へ。長時間露光（ライブフォト）で車の光を流すと◎':'난간을 등지고 타워가 머리 옆에 오는 위치로. 장노출(라이브 포토)로 자동차 불빛을 흘리면 최고.',
'『冬のソナタ』の舞台として韓流ブームの原点になった島。まっすぐ伸びるメタセコイア並木は、秋の紅葉も冬の雪景色も絵になります。':'〈겨울연가〉의 무대로 한류 붐의 원점이 된 섬. 곧게 뻗은 메타세쿼이아길은 가을 단풍도 겨울 설경도 그림이 돼요.',
'紅葉の秋・雪の日の朝':'단풍 드는 가을·눈 온 날 아침','加平の船着き場から船で5分ほど。週末は混雑':'가평 선착장에서 배로 5분 남짓. 주말엔 붐벼요',
'並木の真ん中で奥行きショット':'가로수길 한가운데서 원근감 샷','道の中央に立ち、並木が奥へ消える一点透視で。2人なら少し離れて歩く後ろ姿も名場面風に。':'길 한가운데 서서 가로수가 안쪽으로 사라지는 일점 투시로. 둘이라면 조금 떨어져 걷는 뒷모습도 명장면처럼.',
'世界遺産・水原華城の水門。『ソンジェ背負って走れ』の告白シーンの舞台で、すぐ隣の訪花随柳亭（パンファスリュジョン）も撮影地です。':'세계유산 수원화성의 수문. 〈선재 업고 튀어〉 고백 장면의 무대이고, 바로 옆 방화수류정도 촬영지예요.',
'夕暮れ〜ライトアップ':'해 질 녘~조명','近くの行宮洞（ヘンリダンギル）もドラマのロケ地だらけ':'근처 행궁동(행리단길)도 드라마 촬영지 천지',
'水門のアーチを背に':'수문 아치를 배경으로','川沿いの遊歩道から、7つのアーチと楼閣が全部入る位置で。人物は左3分の1に。':'하천 산책로에서 7개의 아치와 누각이 모두 담기는 위치로. 인물은 왼쪽 3분의 1에.',
'Netflix『おつかれさま』で主人公たちの子ども時代の済州の風景として登場。春は菜の花畑越しの景色が定番です。':'넷플릭스 〈폭싹 속았수다〉에서 주인공들의 어린 시절 제주 풍경으로 등장. 봄엔 유채꽃밭 너머 풍경이 정석이에요.',
'早朝の日の出・菜の花の季節':'이른 아침 일출·유채꽃 시즌','済州島。劇中の漁村は慶尚北道・安東のセットで撮影':'제주도. 극 중 어촌 마을은 경북 안동 세트장에서 촬영',
'菜の花畑越しに日出峰':'유채꽃밭 너머 일출봉','しゃがんで菜の花を手前にぼかし、日出峰を右奥に。黄色と青のコントラストが映えます。':'앉아서 유채꽃을 앞쪽에 흐리게 두고 일출봉은 오른쪽 뒤로. 노랑과 파랑의 대비가 살아나요.',
'1920年代の都市型韓屋が残る細い路地に、カフェや雑貨店がぎっしり。韓屋の軒先と看板がレトロでかわいい通りです。':'1920년대 도시형 한옥이 남은 좁은 골목에 카페와 소품 가게가 빼곡. 한옥 처마와 간판이 레트로하고 귀여운 거리예요.',
'平日の午前〜昼':'평일 오전~점심','鍾路3街駅4番出口から。週末の路地は大混雑':'종로3가역 4번 출구에서. 주말엔 골목이 매우 붐벼요',
'韓屋の路地で見返り':'한옥 골목에서 뒤돌아보기','軒先と看板が両側から迫る位置で。ちょうちんや植物を手前に入れると奥行きが出ます。':'처마와 간판이 양쪽에서 다가오는 위치에서. 등이나 식물을 앞에 넣으면 깊이감이 생겨요.',
'旧京義線の線路跡につくられた公園。延南洞区間（約1.2km）はNYのセントラルパークになぞらえて「ヨントラルパーク」と呼ばれ、芝生でくつろぐ若者や路上ライブでにぎわいます。':'옛 경의선 철길을 공원으로 만든 곳. 연남동 구간(약 1.2km)은 뉴욕 센트럴파크에 빗대 「연트럴파크」라 불리며, 잔디에서 쉬는 젊은이와 버스킹으로 북적여요.',
'週末の夕方（路上ライブ）':'주말 저녁(버스킹)','弘大入口駅3番出口から。周りはカフェの多い延南洞':'홍대입구역 3번 출구에서. 주변은 카페 많은 연남동',
'芝生の小道を歩くショット':'잔디밭 오솔길 걷는 샷','小道の中央を向こうから歩いてもらって連写。木漏れ日の時間帯がベスト。':'오솔길 가운데를 걸어오게 하고 연사. 햇살이 나뭇잎 사이로 드는 시간이 최고.',
'町工場や倉庫をリノベしたカフェやショップが並ぶ「ソウルのブルックリン」。ブランドのポップアップストアが1〜4週間ごとに入れ替わり、韓国の流行が真っ先に集まります。':'공장과 창고를 고친 카페·숍이 늘어선 「서울의 브루클린」. 브랜드 팝업스토어가 1~4주마다 바뀌어 한국 유행이 가장 먼저 모이는 곳이에요.',
'平日の昼（週末は行列多め）':'평일 낮(주말엔 줄이 길어요)','ポップアップは期間限定。行く前にInstagramでチェック':'팝업은 기간 한정. 가기 전에 Instagram에서 확인',
'赤レンガの壁の前で':'붉은 벽돌 벽 앞에서','レンガの目地が水平になるよう、まっすぐ構えて。全身より膝上で切ると今っぽい。':'벽돌 줄눈이 수평이 되게 똑바로 잡고. 전신보다 무릎 위로 자르면 요즘 느낌.',
'600年の歴史をもつ漢陽都城の城壁沿いの道（約2.1km・徒歩1時間）。ソウル市の夜景名所選びで市民の票を最も集めた、韓国人のデート定番スポットです。':'600년 역사의 한양도성 성곽을 따라 걷는 길(약 2.1km·도보 1시간). 서울시 야경 명소 선정에서 시민 표를 가장 많이 받은 데이트 정석 코스예요.',
'夕暮れ〜夜':'해 질 녘~밤','恵化駅から坂を上ります。隣の梨花洞壁画村とセットで':'혜화역에서 언덕을 올라요. 옆 이화마을과 함께',
'ライトアップされた城壁と夜景':'조명 켜진 성곽과 야경','城壁の曲線が画面を斜めに横切るように。人物は城壁にもたれて街の灯りの方を向いて。':'성곽 곡선이 화면을 대각선으로 가로지르게. 인물은 성곽에 기대 도시 불빛 쪽을 바라보게.',
'浄水場の跡地を再生した漢江の島の公園。仙遊橋を渡って夕日を見に行くのがソウルっ子の定番で、日没後は楊花大橋の夜景も楽しめます。':'정수장 터를 되살린 한강 섬 공원. 선유교를 건너 노을 보러 가는 게 서울 사람들의 정석이고, 해가 지면 양화대교 야경도 즐길 수 있어요.',
'日没の30分前から':'일몰 30분 전부터','9号線 仙遊島駅から歩いて行けます':'9호선 선유도역에서 걸어갈 수 있어요',
'橋のシルエットと夕日':'다리 실루엣과 노을','夕日に向かって逆光で。人物をシルエットにすると、空のグラデーションが主役の一枚に。':'노을을 향해 역광으로. 인물을 실루엣으로 담으면 하늘 그라데이션이 주인공인 사진이 돼요.',
'天井から自然光が差し込む屋内庭園で有名なデパート。ドラマ『涙の女王』のクイーンズ百貨店のモデルとしても知られています。':'천장에서 자연광이 쏟아지는 실내 정원으로 유명한 백화점. 드라마 〈눈물의 여왕〉 퀸즈백화점의 모델로도 알려져 있어요.',
'平日の開店直後':'평일 개장 직후','年末はクリスマス装飾目当てで大混雑':'연말엔 크리스마스 장식을 보러 온 사람들로 붐벼요',
'屋内庭園を見下ろして':'실내 정원을 내려다보며','吹き抜けの手すり側から、天井の光と緑が入るように見上げ気味に。':'오픈된 층 난간 쪽에서 천장 빛과 초록이 담기게 살짝 올려다보며.',

'ソウル・鍾路区':'서울 종로구','ソウル・中区':'서울 중구','江原道・江陵市':'강원도 강릉시','ソウル・龍山区':'서울 용산구','『トッケビ』':'〈도깨비〉','『星から来たあなた』ほか':'〈별에서 온 그대〉 등',
'韓服で入場無料':'한복 착용 시 무료 입장','火曜休み':'화요일 휴궁','世界遺産':'세계유산','月曜休み':'월요일 휴궁','瓦屋根の坂道':'기와지붕 골목','訪問は10〜17時':'방문 10~17시','秋はイチョウ':'가을엔 은행나무','夜も散策できる':'밤 산책 가능','ソウルから約2.5〜3時間':'서울에서 약 2.5~3시간','愛の南京錠':'사랑의 자물쇠',
'朝鮮王朝の正宮。正殿の勤政殿（クンジョンジョン）と池に浮かぶ慶会楼（キョンフェル）が定番の撮影ポイントです。':'조선 왕조의 법궁. 정전인 근정전과 연못 위의 경회루가 대표 촬영 포인트예요.',
'開門直後の9時台／閉門前の夕方':'개장 직후 9시대 / 폐장 전 저녁','毎週火曜休み。韓服を着ると入場無料':'매주 화요일 휴궁. 한복을 입으면 무료 입장',
'勤政殿を背に全身ショット':'근정전을 배경으로 전신 샷','カメラを腰の高さまで下げると、屋根の反りと石段まで入って堂々とした一枚に。':'카메라를 허리 높이까지 낮추면 처마 곡선과 돌계단까지 담겨 웅장한 사진이 돼요.',
'慶会楼と池のリフレクション':'경회루와 연못 반영','池のほとりに立ち、楼閣は右側へ。水面に映る柱まで入れるのがコツ。':'연못가에 서고 누각은 오른쪽에. 물에 비친 기둥까지 담는 게 포인트예요.',
'回廊の柱でフレーミング':'회랑 기둥으로 프레이밍','柱の列の中央に立ち、撮る人は離れてズーム。奥行きで人物が引き立ちます。':'기둥 줄 가운데 서고, 찍는 사람은 떨어져서 줌. 깊이감 덕분에 인물이 돋보여요.',

  if(lang!=='ko'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){const k=n.nodeValue.trim();if(k&&KO[k])n.nodeValue=n.nodeValue.replace(k,KO[k])}

}

function poseInner(p,col){
  const st=`fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"`;
  if(p.raw)return `<g ${st}>${p.raw(col)}</g>`;
  const f=p.fig,hd=f.head||[60,34];let s=`<g ${st}>`;
  s+=f.back?`<circle cx="${hd[0]}" cy="${hd[1]}" r="13" fill="${col}"/><path d="M48,34 H72" stroke="#C99A2E"/>`:`<circle cx="${hd[0]}" cy="${hd[1]}" r="13"/>`;
  if(f.dress)s+=`<path d="${f.dress}" fill="${col}" fill-opacity=".12"/>`;
  s+=`<polyline points="${f.torso||'60,48 60,98'}"/>`;
  (f.legs||['60,98 50,148','60,98 70,148']).forEach(l=>s+=`<polyline points="${l}"/>`);
  f.arms.forEach(a=>{if(a.startsWith('M'))s+=`<path d="${a}"/>`;else{s+=`<polyline points="${a}"/>`;const e=a.split(' ').pop().split(',');s+=`<circle cx="${e[0]}" cy="${e[1]}" r="${f.fist?5:2.6}" fill="${col}"/>`}});
  s+=(typeof f.extra==='function'?f.extra(col):(f.extra||''))+'</g>';return s;
}

  ['my','マイ','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/>']];
function render(){
  const v=state.view;
  $('#main').innerHTML=v==='spot'?vSpot():v==='hanbok'?vHanbok():v==='poses'?vPoses():v==='my'?vMy():vSpots();
  const cur=v==='spot'?'spots':v;
  tr($('#main'));
  $('#tabs').innerHTML=TABS.map(([k,l,ic])=>`<button data-act="go" data-v="${k}" ${cur===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${l}</button>`).join('');
  tr($('#tabs'));$('#tabs').setAttribute('aria-label',t('メインメニュー'));
}
function route(){
  const h=location.hash.slice(1)||'spots';
  if(h.startsWith('spot-')){state.view='spot';state.spot=h.slice(5)}
  else state.view=['spots','hanbok','poses','my'].includes(h)?h:'spots';
  render();window.scrollTo(0,0);
}
function go(v){if(location.hash==='#'+v)route();else location.hash=v}

/* ---------- camera / AR ---------- */
let cam=null;
function openCam(cfg){
  cam=Object.assign({mode:'hanbok',x:.5,y:.6,size:.62,op:.85,stream:null,bgUrl:null,demo:false,pose:0},cfg);
  const m=$('#cam');m.hidden=false;
  m.innerHTML=`<div class="inner"><div class="m-head"><strong>ARカメラ</strong><button class="x" data-act="camclose" aria-label="閉じる">×</button></div>
  <div class="stage" id="stage"><video id="cv" playsinline muted autoplay hidden></video><img id="cbg" class="bg" alt="読み込んだ写真" hidden><div id="cdemo" class="bgsvg" hidden></div>
  <div id="cfall" class="fall"><p>カメラを起動しています…</p></div><div id="ov"></div></div>
  <div class="m-chips" id="cmodes"></div><div class="m-chips" id="cposes"></div>
  <div class="sliders" id="csl"><label for="csize">大きさ</label><input type="range" id="csize" min="20" max="100" value="${cam.size*100}"><label for="cop">透明度</label><input type="range" id="cop" min="30" max="100" value="${cam.op*100}"></div>
  <div class="cam-actions"><label class="btn ghost" for="cfile">写真を撮る・選ぶ</label><button class="btn red" data-act="shutter">撮影して保存</button></div>
  <input type="file" id="cfile" accept="image/*" capture="${cam.mode==='hanbok'?'user':'environment'}" hidden>
  <p class="hint" id="chint"></p></div>`;
  $('#cfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{stopStream();cam.bgUrl=r.result;cam.demo=false;showBg()};r.readAsDataURL(f)});
  $('#csize').addEventListener('input',e=>{cam.size=e.target.value/100;drawOv()});
  $('#cop').addEventListener('input',e=>{cam.op=e.target.value/100;drawOv()});
  tr(m);bindDrag();drawCamUI();startStream();
}
async function startStream(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('none');
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.mode==='hanbok'?'user':'environment'},audio:false});
    if(!cam){s.getTracks().forEach(t=>t.stop());return}
    cam.stream=s;const v=$('#cv');v.srcObject=s;showBg();
  }catch(e){ if(cam)showBg() }
}
function stopStream(){if(cam&&cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}}
function showBg(){
  const v=$('#cv'),im=$('#cbg'),d=$('#cdemo'),f=$('#cfall');
  v.hidden=!cam.stream;im.hidden=!cam.bgUrl||!!cam.stream;d.hidden=!cam.demo||!!cam.stream||!!cam.bgUrl;
  if(cam.bgUrl)im.src=cam.bgUrl;
  if(cam.demo)d.innerHTML=svg(scene('palace',state.pvTod),'0 0 300 400','preserveAspectRatio="xMidYMid slice"');
  const has=cam.stream||cam.bgUrl||cam.demo;f.hidden=!!has;
  if(!has)f.innerHTML=`<p>この環境ではライブカメラを起動できませんでした。<br>「写真を撮る・選ぶ」でスマホのカメラを開くか、サンプル背景で試せます。</p><button class="btn small" data-act="usedemo">サンプル背景（景福宮）で試す</button>`;
  tr(f);
}
function drawCamUI(){
  const modes=[cam.shot?['guide','構図ガイド']:null,['hanbok','韓服を試着'],['pose','ポーズ見本']].filter(Boolean);
  $('#cmodes').innerHTML=modes.map(([k,l])=>`<button class="chip ${cam.mode===k?'on':''}" data-act="cmode" data-v="${k}">${l}</button>`).join('');
  $('#cposes').innerHTML=cam.mode==='pose'?POSES.map((p,i)=>`<button class="chip ${cam.pose===i?'on':''}" data-act="cpose" data-i="${i}">${p.ja}</button>`).join(''):'';
  $('#cposes').hidden=cam.mode!=='pose';
  $('#csl').style.display=cam.mode==='guide'?'none':'grid';
  $('#chint').textContent=cam.mode==='guide'?`「${t(cam.shot.t)}」${lang==='ko'?': ':'：'}${t('点線の人型の位置に立ってもらい、グリッドに合わせて撮影。')}${t(cam.shot.tip)}`:
    t(cam.mode==='hanbok'?'セルフィーを撮る（または選ぶ）と、選んだ韓服を重ねられます。ドラッグで首元に合わせ、大きさを調整してください。':
    'ポーズ見本をドラッグして配置。同じポーズで撮ってもらいましょう。');
  tr($('#cmodes'));tr($('#cposes'));drawOv();
}
function drawOv(){
  const ov=$('#ov');if(!ov)return;
  if(cam.mode==='guide'){ov.className='full';ov.removeAttribute('style');ov.innerHTML=svg(guideLayer(cam.shot,true),'0 0 300 400','preserveAspectRatio="none"');tr(ov);return}
  ov.className='';ov.style.left=cam.x*100+'%';ov.style.top=cam.y*100+'%';ov.style.width=cam.size*100+'%';ov.style.opacity=cam.op;
  ov.innerHTML=cam.mode==='hanbok'?svg(figInner(state.h,{headless:true}),'0 0 200 320'):svg(poseInner(POSES[cam.pose],'#fff'),'0 0 120 160');tr(ov);
}
function bindDrag(){
  const st=$('#stage');let d=null;
  st.addEventListener('pointerdown',e=>{if(cam.mode==='guide'||!e.target.closest('#ov'))return;d={sx:e.clientX,sy:e.clientY,x:cam.x,y:cam.y};st.setPointerCapture(e.pointerId)});
  st.addEventListener('pointermove',e=>{if(!d)return;const r=st.getBoundingClientRect();cam.x=Math.min(1,Math.max(0,d.x+(e.clientX-d.sx)/r.width));cam.y=Math.min(1.1,Math.max(0,d.y+(e.clientY-d.sy)/r.height));drawOv()});
  const end=()=>d=null;st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
}
const svgImg=str=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str)});
async function shoot(){
  const W=900,H=1200,cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  const cover=(src,sw,sh)=>{const r=Math.max(W/sw,H/sh),w=sw*r,h=sh*r;ctx.drawImage(src,(W-w)/2,(H-h)/2,w,h)};
  try{
    const v=$('#cv');
    if(cam.stream&&v.videoWidth)cover(v,v.videoWidth,v.videoHeight);
    else if(cam.bgUrl){const im=$('#cbg');cover(im,im.naturalWidth,im.naturalHeight)}
    else if(cam.demo){const im=await svgImg(svg(scene('palace',state.pvTod),'0 0 300 400','width="900" height="1200" preserveAspectRatio="xMidYMid slice"'));ctx.drawImage(im,0,0,W,H)}
    else{toast('先に写真を撮るか選んでください');return}
    if(cam.mode==='hanbok'){const fw=cam.size*W,fh=fw*1.6;const im=await svgImg(svg(figInner(state.h,{headless:true,clean:true}),'0 0 200 320',`width="${fw}" height="${fh}"`));ctx.drawImage(im,cam.x*W-fw/2,cam.y*H-fh/2,fw,fh)}
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 26px sans-serif';ctx.fillText('韓旅フォト',28,H-30);
    showResult(cv.toDataURL('image/jpeg',.9));
  }catch(e){toast('画像を作成できませんでした')}
}
function showResult(url){
  const m=$('#res');m.hidden=false;
  m.innerHTML=`<div class="inner res"><div class="m-head"><strong>できあがり</strong><button class="x" data-act="resclose" aria-label="閉じる">×</button></div><img src="${url}" alt="作成した写真"><p class="hint">画像を長押し（PCは右クリック）して保存してください。プロトタイプのため、自動保存には対応していません。</p></div>`;
  tr(m);
}
/* ---------- preview at Gyeongbokgung ---------- */
const BGS=[['palace','勤政殿',85,180,130],['pavilion','慶会楼',36,196,118],['wall','石垣道',150,184,126],['hanok','北村',92,196,116]];
function pvSVG(){
  const b=BGS.find(x=>x[0]===state.bg)||BGS[0],[,,x,y,w]=b,hgt=w*1.6;
  return scene(b[0],state.pvTod)+`<ellipse cx="${x+w/2}" cy="${y+hgt-4}" rx="${w*.36}" ry="6" fill="rgba(0,0,0,.18)"/><svg x="${x}" y="${y}" width="${w}" height="${hgt}" viewBox="0 0 200 320">${figInner(state.h,{face:faceUrl()})}</svg>`;
}
function openPv(){
  const m=$('#pv');m.hidden=false;
  m.innerHTML=`<div class="inner pv"><div class="m-head"><strong>韓服プレビュー</strong><button class="x" data-act="pvclose" aria-label="閉じる">×</button></div>
  <div id="pvart">${svg(pvSVG(),'0 0 300 400')}</div>
  <div class="m-chips">${BGS.map(([k,l])=>`<button class="chip ${state.bg===k?'on':''}" data-act="pvbg" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="m-chips">${TODS.map(([k,l])=>`<button class="chip ${state.pvTod===k?'on':''}" data-act="pvtod" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="cam-actions"><button class="btn" data-act="pvimg">画像にする</button><button class="btn red" data-act="tryon">カメラで試着（AR）</button></div>
  <p class="hint">時間帯を変えると、実際の光の雰囲気に近い色味で確認できます。夜は景福宮の夜間特別観覧（期間限定）のイメージです。</p></div>`;
  tr(m);
}
async function pvImg(){
  try{const im=await svgImg(svg(pvSVG(),'0 0 300 400','width="900" height="1200"'));const cv=document.createElement('canvas');cv.width=900;cv.height=1200;const c=cv.getContext('2d');c.drawImage(im,0,0);c.fillStyle='rgba(255,255,255,.9)';c.font='bold 26px sans-serif';c.fillText('韓旅フォト',28,1170);showResult(cv.toDataURL('image/png'))}catch(e){toast('画像を作成できませんでした')}
}

/* ---------- events ---------- */
function saveH(){store.set('h',state.h)}
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const d=a.dataset;
  switch(d.act){
    case 'lang':setLang(d.v);render();break;
    case 'facetoggle':state.useFace=!state.useFace;store.set('useFace',state.useFace);render();break;
    case 'facedel':state.face=null;store.set('face',null);render();break;
    case 'cropclose':$('#crop').hidden=true;break;
    case 'cropok':cropOk();break;
    case 'go':go(d.v);break;
    case 'cat':state.cat=d.v;render();break;
    case 'tod':state.tod=d.v;render();break;
    case 'pf':state.pf=d.v;render();break;
    case 'quiz':state.quiz={i:0,s:{w:0,c:0,l:0,d:0}};render();break;
    case 'ans':{const q=state.quiz,k=QUIZ[q.i].a[+d.i][1];if(k)q.s[k]++;q.i++;
      if(q.i>=QUIZ.length){const s=q.s;state.season=s.w>=s.c?(s.l>=s.d?'spring':'autumn'):(s.l>=s.d?'summer':'winter');state.quiz=null;state.seasonSrc='quiz';store.set('season',state.season);store.set('seasonSrc','quiz');
        const c=SEASONS[state.season].combos[0];Object.assign(state.h,{jeo:c[0],chima:c[1],acc:c[2]});saveH();toast(lang==='ko'?t(SEASONS[state.season].ja)+' 결과가 나왔어요':SEASONS[state.season].ja+'でした');}
      render();break}
    case 'setseason':state.season=d.v;state.seasonSrc='pick';store.set('season',d.v);store.set('seasonSrc','pick');render();break;
    case 'seasonclear':state.season=null;store.set('season',null);render();break;
    case 'quizstop':state.quiz=null;render();break;
    case 'hb':state.h[d.k]=d.v;saveH();render();break;
    case 'hbset':state.h[d.k]=d.k==='gold'?d.v==='1':d.v;saveH();render();break;
    case 'combo':{const c=SEASONS[state.season].combos[+d.i];Object.assign(state.h,{jeo:c[0],chima:c[1],acc:c[2]});saveH();render();break}
    case 'save':state.saved.unshift({...state.h});state.saved=state.saved.slice(0,9);store.set('saved',state.saved);toast('マイページに保存しました');break;
    case 'load':state.h={...state.saved[+d.i]};saveH();go('hanbok');break;
    case 'del':state.saved.splice(+d.i,1);store.set('saved',state.saved);render();break;
    case 'copy':try{await navigator.clipboard.writeText(PHRASES[+d.i][0]);toast('コピーしました')}catch(err){toast('コピーできませんでした')}break;
    case 'preview':openPv();break;
    case 'pvclose':$('#pv').hidden=true;break;
    case 'pvbg':state.bg=d.v;openPv();break;
    case 'pvtod':state.pvTod=d.v;openPv();break;
    case 'pvimg':pvImg();break;
    case 'tryon':$('#pv').hidden=true;openCam({mode:'hanbok'});break;
    case 'shotcam':{const s=SPOTS.find(x=>x.id===d.id);openCam({mode:'guide',shot:s.shots[+d.i]});break}
    case 'posecam':openCam({mode:'pose',pose:+d.i,size:.5,y:.55,op:.9});break;
    case 'cmode':cam.mode=d.v;if(d.v==='pose'){cam.size=.5;cam.y=.55}else if(d.v==='hanbok'){cam.size=.62;cam.y=.6}$('#csize').value=cam.size*100;drawCamUI();break;
    case 'cpose':cam.pose=+d.i;drawCamUI();break;
    case 'usedemo':cam.demo=true;showBg();break;
    case 'shutter':shoot();break;
    case 'camclose':stopStream();cam=null;$('#cam').hidden=true;$('#cam').innerHTML='';break;
    case 'resclose':$('#res').hidden=true;break;
  }
});
document.addEventListener('change',e=>{if(e.target.id!=='facefile')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>openCrop(r.result);r.readAsDataURL(f);e.target.value=''});
let crop=null;
function openCrop(url){
  const m=$('#crop');m.hidden=false;
  m.innerHTML=`<div class="inner"><div class="m-head"><strong>顔の位置を合わせる</strong><button class="x" data-act="cropclose" aria-label="閉じる">×</button></div>
  <div class="crop" id="cropvp"><img id="cropimg" alt=""><div class="crop-mask"></div></div>
  <div class="sliders"><label for="cropz">ズーム</label><input type="range" id="cropz" min="100" max="400" value="100"></div>
  <p class="hint">点線の円に顔が収まるように、ドラッグとズームで調整してください。</p><button class="btn block" data-act="cropok">この写真で決定</button></div>`;
  tr(m);
  const im=$('#cropimg');crop={z:1,ox:0,oy:0,w:1,h:1,img:im};
  im.onload=()=>{crop.w=im.naturalWidth;crop.h=im.naturalHeight;cropDraw()};im.src=url;
  $('#cropz').addEventListener('input',e=>{crop.z=e.target.value/100;cropDraw()});
  const vp=$('#cropvp');let d=null;
  vp.addEventListener('pointerdown',e=>{d={x:e.clientX,y:e.clientY,ox:crop.ox,oy:crop.oy};vp.setPointerCapture(e.pointerId)});
  vp.addEventListener('pointermove',e=>{if(!d)return;crop.ox=d.ox+e.clientX-d.x;crop.oy=d.oy+e.clientY-d.y;cropDraw()});
  vp.addEventListener('pointerup',()=>d=null);vp.addEventListener('pointercancel',()=>d=null);
}
function cropGeom(){const V=260,s=Math.max(V/crop.w,V/crop.h)*crop.z;return{V,s,left:V/2-crop.w*s/2+crop.ox,top:V/2-crop.h*s/2+crop.oy}}
function cropDraw(){const g=cropGeom(),im=crop.img;im.style.width=crop.w*g.s+'px';im.style.height=crop.h*g.s+'px';im.style.left=g.left+'px';im.style.top=g.top+'px'}
function cropOk(){
  try{const g=cropGeom(),cv=document.createElement('canvas');cv.width=cv.height=256;
    cv.getContext('2d').drawImage(crop.img,-g.left/g.s,-g.top/g.s,g.V/g.s,g.V/g.s,0,0,256,256);
    state.face=cv.toDataURL('image/jpeg',.85);state.useFace=true;store.set('face',state.face);store.set('useFace',true);
    $('#crop').hidden=true;render();toast('写真を登録しました');
  }catch(e){toast('画像を作成できませんでした')}
}
window.addEventListener('hashchange',route);
setLang(lang);
route();
</script>
</body>
