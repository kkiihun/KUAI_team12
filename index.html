<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f3">
  <meta name="description" content="Pilk — 여행지에서 실시간 포즈 코칭 & 주변 추천.">
  <title>Pilk · Travel Photo Coach</title>
  <link rel="icon" href="assets/brand/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Quicksand:wght@600;700&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/leaflet/leaflet.css">
  <script>(function(){try{var th=localStorage.getItem("pilk-v5-theme");if(th==="blue"||th==="dark")document.documentElement.setAttribute("data-theme",th);}catch(e){}})();</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-bar">
  <button type="button" class="brand" data-tab="camera" aria-label="Pilk">
    <img class="brand-logo" src="assets/brand/pilk-logo.png" alt="Pilk" width="1564" height="566">
    <small class="brand-tag" data-t="tagline"></small>
  </button>

  <!-- Desktop top tab bar (hidden on mobile where bottom tab bar is used) -->
  <nav class="desktop-tabs" aria-label="Pages">
    <button type="button" class="dtab active" data-tab="camera" data-t="tabCam"></button>
    <button type="button" class="dtab" data-tab="nearby" data-t="tabNearby"></button>
    <button type="button" class="dtab" data-tab="saved" data-t="tabSaved"></button>
  </nav>

  <div class="bar-right">
    <button type="button" class="howto-btn" id="howtoBtn" aria-label="How to use">?</button>
    <div class="lang-pill" role="group" aria-label="Language">
      <button type="button" id="lang-ko" class="selected" aria-pressed="true">KR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
      <button type="button" id="lang-ja" aria-pressed="false">JP</button>
    </div>
  </div>
</header>

<main class="pages-shell">

  <!-- ==================== PAGE 1: CAMERA (DEFAULT, ZERO-SCROLL) ==================== -->
  <section class="tab-page active" id="page-camera" data-page="camera">
    <div class="camera-card">
      <div class="vf-zone">
      <div class="viewfinder" id="viewfinderStage">
        <img id="stageBgImg" src="assets/poses/flip.webp?v=14" alt="Scene">
        <video id="stageVideo" autoplay playsinline muted></video>
        <canvas id="landmarks" aria-hidden="true" hidden></canvas>

        <div id="poseIntro" hidden><strong id="introNumber">5</strong><span data-t="introHint"></span><button type="button" id="skipIntroBtn" data-t="skipIntro"></button></div>
        <output id="countdown" hidden aria-live="polite"></output>
        <div class="vf-grid" id="vfGrid"></div>
        <div class="vf-foot-line" id="vfFootLine"><span>FOOT LINE</span></div>
        <div class="vf-overlay" id="vfOverlay"></div>
        <div class="vf-scan-laser hidden" id="vfScanLaser"></div>

        <!-- Minimal Top Overlay -->
        <div class="vf-top">
          <div class="vf-top-left">
            <button type="button" class="vf-ratio-btn" id="vfRatioBtn">16:9</button>
            <span class="match-pill" id="vfMatchPill" hidden><strong id="vfMatchScore">100%</strong></span>
          </div>
          <div class="vf-top-right">
            <div class="vf-tools-wrap" id="vfToolsWrap">
              <button type="button" class="vf-tools-btn" id="vfToolsToggleBtn" aria-label="기능" aria-haspopup="dialog" aria-expanded="false" aria-controls="vfToolsMenu">
                <span data-icon="tools"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Mode B: 3 tiny pills -->
        <div class="vf-steps hidden" id="vfModeBStrip"></div>

        <!-- Single-Line Live Cue -->
        <div class="vf-cue">
          <div class="vf-vibe" id="vfVibe"><span class="vf-vibe-label" data-t="vibeLabel"></span><span class="vf-vibe-bar"><i></i></span><b id="vfVibeValue"></b></div>
          <div class="vf-cue-row">
            <p id="vfDirText"></p>
            <button type="button" class="vf-voice-btn" id="speakCueBtn" aria-label="음성">
              <span data-icon="volume"></span>
            </button>
          </div>
        </div>

        <!-- 10s Helper Mode Full Overlay -->
        <div class="vf-helper hidden" id="vfHelperCard">
          <span class="helper-chip">PILK · 10s GUIDE</span>
          <h3 data-t="helperTitle"></h3>
          <div class="helper-box" id="vfHelperSteps"></div>
          <button type="button" class="btn primary" id="closeHelperBtn" data-t="helperClose"></button>
        </div>
      </div>
      </div>

      <!-- Integrated Pose Strip -->
      <div class="dark-pose-strip" id="poseStrip"></div>
    </div>

    <!-- Unified Settings & Pose Guide Sheet (opened from top-right gear button) -->
    <div class="vf-tools-backdrop" id="vfToolsBackdrop" hidden></div>
    <div class="vf-tools-menu" id="vfToolsMenu" role="dialog" aria-modal="true" hidden>
      <div class="vf-tools-head">
        <span class="vf-tools-title" data-t="toolsMenu"></span>
        <button type="button" class="vf-tools-close" id="vfToolsCloseBtn" aria-label="Close">✕</button>
      </div>

      <div class="vf-tools-actions">
        <button type="button" class="vf-tool-item" id="toggleCamBtn">
          <span class="vf-tool-icon" data-icon="camera"></span>
          <span class="vf-tool-label" id="toggleCamLabel" data-t="dockCamOn"></span>
          <span class="vf-tool-state" id="toggleCamState">OFF</span>
        </button>
        <button type="button" class="vf-tool-item" id="autoCamToggleBtn" aria-pressed="true">
          <span class="vf-tool-icon" data-icon="bolt"></span>
          <span class="vf-tool-label" data-t="menuAutoCam"></span>
          <span class="vf-tool-state" id="autoCamState">ON</span>
        </button>
        <button type="button" class="vf-tool-item is-accent" id="vfScanBtn">
          <span class="vf-tool-icon" data-icon="scan"></span>
          <span class="vf-tool-label" data-t="btnScan"></span>
        </button>
        <button type="button" class="vf-tool-item" id="guideToggleBtn" aria-pressed="true">
          <span class="vf-tool-icon" id="guideToggleIcon" data-icon="eye"></span>
          <span class="vf-tool-label" data-t="menuGuide"></span>
          <span class="vf-tool-state" id="guideToggleState">ON</span>
        </button>
        <button type="button" class="vf-tool-item" id="switchFacingBtn" aria-label="Switch front/rear camera">
          <span class="vf-tool-icon" data-icon="flipcam"></span>
          <span class="vf-tool-label" data-t="menuSwitch"></span>
          <span class="vf-tool-state" id="switchFacingState">후면</span>
        </button>
        <button type="button" class="vf-tool-item" id="helperModeBtn" aria-label="10s Helper Card">
          <span class="vf-tool-icon" data-icon="helper"></span>
          <span class="vf-tool-label" data-t="menuHelper"></span>
        </button>
      </div>

      <aside class="studio-panel">
        <div class="guide-panel"><img id="guidePhoto" alt=""><h1 id="guideTitle"></h1><ol id="guideSteps"></ol></div>
        <div class="quick-bar">
          <div class="mini-seg" role="tablist">
            <button type="button" class="mseg selected" data-mode="A" data-t="modeA"></button>
            <button type="button" class="mseg" data-mode="B" data-t="modeB"></button>
            <button type="button" class="mseg" data-mode="C" data-t="modeC"></button>
          </div>
          <div class="quick-toggles"><label class="qchip"><span data-t="timer"></span> <select id="timerDelay"><option value="0" data-t="off"></option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select></label>
            <button type="button" class="qchip active" id="btnFlip180"><span data-t="flipShort"></span></button>
            <button type="button" class="qhelp" id="flipHelpBtn" aria-label="What is Flip Phone 180°?">?</button>
            <button type="button" class="qchip active" id="btnFrontFoot"><span data-t="footShort"></span></button>
            <button type="button" class="qchip" id="btnLensCycle">1×</button>
            <button type="button" class="qchip" id="btnDistCycle">최적</button>
          </div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ==================== PAGE 2: NEARBY & LOCAL COUPONS ==================== -->
  <section class="tab-page" id="page-nearby" data-page="nearby">
    <div class="page-head">
      <h1 data-t="nearbyHeading" data-eyebrow="Explore"></h1>
      <button type="button" class="btn primary sm" id="rescanBtn">
        <span data-icon="scan"></span><span data-t="rescanBtn"></span>
      </button>
    </div>

    <div class="current-spot-banner">
      <img id="nearbyThumb" src="assets/palace-courtyard.webp" alt="">
      <div class="banner-text">
        <b id="scanSpotTitle">경복궁</b>
        <small id="scanLightTag">자연광 · 180° · 1×</small>
      </div>

    </div>

    <div class="explore-layout"><div class="map-column"><div class="explore-tools">
      <button class="btn outline sm" id="spotMap" data-t="tabSpots"></button>
      <button class="btn outline sm" id="salonMap" data-t="salons"></button>
      <button class="btn outline sm" id="castingBtn" data-t="casting"></button>
    </div>
    <div class="nearby-map-card">
      <div id="spotPins" hidden aria-label="Spot map"></div>
      <iframe id="nearbyMapFrame" title="Nearby Spot Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      <div class="map-bar">
        <span class="map-label" id="nearbyMapLabel">📍 경복궁</span>
        <a class="map-ext-link" id="nearbyMapLink" href="#" target="_blank" rel="noopener noreferrer" data-t="openBigMap"></a>
      </div>
    </div>

    <section id="castingResults" aria-live="polite" hidden></section>
    <details class="deals"><summary data-t="deals"></summary><div class="nearby-stack" id="nearbyList"></div>
    <p class="coupon-disclaimer" data-t="couponDisclaimer"></p>
    </details></div><div class="spots-column">
    <div class="page-head">
      <h1 data-t="spotsHeading" data-eyebrow="Spots"></h1>
      <label class="search-pill">
        <span data-icon="search"></span>
        <input id="searchInput" type="search" data-placeholder="searchPlaceholder">
      </label>
    </div>

    <div class="pill-scroll filter-row">
      <button type="button" class="filter-chip selected" data-filter="all"><span data-t="filterAll"></span></button>
      <button type="button" class="filter-chip" data-filter="insta"><span data-t="filterInsta"></span></button>
      <button type="button" class="filter-chip" data-filter="tiktok"><span data-t="filterTiktok"></span></button>
      <button type="button" class="filter-chip" data-filter="drama"><span data-t="filterDrama"></span></button>
      <button type="button" class="filter-chip" data-filter="heritage"><span data-t="filterHeritage"></span></button>
      <button type="button" class="filter-chip" data-filter="nature"><span data-t="filterNature"></span></button>
    </div>

    <div class="spot-grid" id="spotGrid"></div>
    <div class="more-wrap">
      <button type="button" class="btn outline sm" id="loadMoreBtn"></button>
    </div>
    <p class="empty-msg hidden" id="emptySearch" data-t="emptySearch"></p></div></div>
  </section>

  <!-- ==================== PAGE 4: SAVED & SETTINGS ==================== -->
  <section class="tab-page" id="page-saved" data-page="saved">
    <div class="page-head">
      <h1 data-t="savedHeading" data-eyebrow="Favorites"></h1>
    </div>

    <div id="savedContent"></div>

    <div class="settings-card">
      <h3 data-t="settingsTitle"></h3>
      <div class="setting-row theme-row">
        <span data-t="themeLabel"></span>
        <div class="theme-swatches" role="group">
          <button type="button" class="theme-swatch" data-theme-pick="pink"><i></i><span data-t="themePink"></span></button>
          <button type="button" class="theme-swatch" data-theme-pick="blue"><i></i><span data-t="themeBlue"></span></button>
          <button type="button" class="theme-swatch" data-theme-pick="dark"><i></i><span data-t="themeDark"></span></button>
        </div>
      </div>
      <label class="setting-row">
        <span data-t="opacityLabel"></span>
        <div class="range-wrap">
          <input type="range" id="opacitySlider" min="15" max="100" value="72">
          <b id="opacityVal">72%</b>
        </div>
      </label>
      <label class="setting-row">
        <span data-t="skeletonSetting"></span>
        <input type="checkbox" id="skeletonToggle" checked>
      </label>
      <label class="setting-row">
        <span data-t="skipIntroSetting"></span>
        <input type="checkbox" id="skipIntroToggle">
      </label>
      <label class="setting-row">
        <span data-t="gridLabel"></span>
        <input type="checkbox" id="gridToggle" checked>
      </label>
    </div>

    <div class="settings-card">
      <h3 data-t="infoTitle"></h3>
      <button type="button" class="info-link-row" id="openHowtoBtn">
        <span id="howtoRowLabel"></span><span>›</span>
      </button>
      <button type="button" class="info-link-row" id="openCreditsBtn">
        <span data-t="footerCredits"></span><span>↗</span>
      </button>
    </div>
  </section>

</main>

<!-- UNIFIED SINGLE-ROW BOTTOM DOCK (NAV + CAMERA) -->
<nav class="app-dock" id="appDock" aria-label="App Navigation">
  <button type="button" class="dock-btn btab" data-tab="nearby">
    <span class="dock-ico tab-icon-wrap"><span data-icon="pin"></span><i class="notif-dot hidden" id="nearbyDot"></i></span>
    <small data-t="tabNearby"></small>
  </button>

  <label class="dock-btn" for="uploadSceneInput">
    <span class="dock-ico" data-icon="upload"></span>
    <small data-t="dockPhoto"></small>
  </label>
  <input type="file" id="uploadSceneInput" accept="image/jpeg,image/png,image/webp" class="sr-only">

  <button type="button" class="shutter-circle" id="shutterBtn" aria-label="Capture">
    <span class="shutter-core"><i class="shutter-cam-ico" data-icon="camera"></i></span>
  </button>

  <button type="button" class="dock-btn" id="exportStoryBtn">
    <span class="dock-ico" data-icon="spark"></span>
    <small data-t="dockStory"></small>
  </button>

  <button type="button" class="dock-btn btab" data-tab="saved">
    <span class="dock-ico tab-icon-wrap"><span data-icon="bookmark"></span><b class="tab-badge hidden" id="saveCount">0</b></span>
    <small data-t="tabSaved"></small>
  </button>
</nav>

<dialog id="modal">
  <button type="button" class="modal-close" id="closeModal" aria-label="Close">✕</button>
  <div id="modalContent"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="spots-data.js"></script>
<script src="pilk-data.js"></script>
<script src="assets/leaflet/leaflet.js"></script>
<script src="explore-map.js"></script>
<script src="poses.js"></script>
<script src="casting-listings.js"></script>
<script src="studio.js"></script>
<script src="pose-templates.js"></script>
<script src="pose-tracking.js"></script>
<script src="scene-meter.js"></script>
<script src="app.js"></script>
</body>
</html>
