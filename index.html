<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d110f">
  <meta name="description" content="PILK — Picture It Like Korean. 실시간 한국식 포토 코칭 & 주변 추천.">
  <title>Pilk · Picture It Like Korean</title>
  <link rel="icon" href="assets/pilk-studio.svg?v=20" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body>

<header class="app-bar">
  <button type="button" class="brand" data-tab="camera" aria-label="Pilk">
    <img class="brand-symbol" src="assets/pilk-studio.svg?v=20" alt="">
    <span class="brand-name">Pilk</span>
  </button>

  <!-- Desktop top tab bar (hidden on mobile where floating bottom tab bar is used) -->
  <nav class="desktop-tabs" aria-label="Pages">
    <button type="button" class="dtab active" data-tab="camera" data-t="tabCam"></button>
    <button type="button" class="dtab" data-tab="nearby" data-t="tabNearby"></button>
    <button type="button" class="dtab" data-tab="saved" data-t="tabSaved"></button>
  </nav>

  <div class="bar-right"></div>
</header>

<main class="pages-shell">

  <!-- ==================== PAGE 1: FULLSCREEN NATIVE CAMERA ==================== -->
  <section class="tab-page active" id="page-camera" data-page="camera">
    <div class="camera-card">
      <div class="viewfinder" id="viewfinderStage">
        <!-- Pure-CSS Advanced Settings Popover Toggle -->
        <input type="checkbox" id="studioDrawerToggle" class="sr-only" aria-hidden="true">

        <!-- Camera Feed & Live Tracking -->
        <img id="stageBgImg" src="assets/poses/flip.webp?v=14" alt="Scene">
        <video id="stageVideo" autoplay playsinline muted></video>
        <canvas id="landmarks" aria-hidden="true" hidden></canvas>

        <!-- Guides & Timers -->
        <div id="poseIntro" hidden><strong id="introNumber">5</strong><span data-t="introHint"></span></div>
        <output id="countdown" hidden aria-live="polite"></output>
        <div class="vf-grid" id="vfGrid"></div>
        <div class="vf-foot-line" id="vfFootLine"><span>FOOT LINE</span></div>
        <div class="vf-overlay" id="vfOverlay"></div>
        <div class="vf-scan-laser hidden" id="vfScanLaser"></div>

        <!-- Unified Floating Top Bar -->
        <div class="vf-top">
          <div class="vf-top-left">
            <button type="button" class="spot-pill" data-tab="spots">
              <span class="spot-pin" aria-hidden="true">📍</span>
              <span id="vfSpotName">경복궁</span>
            </button>
          </div>
          <div class="vf-top-right">
            <button type="button" class="glass-btn" id="switchFacingBtn" aria-label="Switch front/rear camera">
              <span data-icon="flipcam"></span>
            </button>
            <label for="studioDrawerToggle" class="glass-btn settings-toggle-btn" role="button" tabindex="0" aria-label="Camera Settings">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </label>
          </div>
        </div>

        <!-- Backdrop & Collapsible Glass Popover for Advanced Settings -->
        <label for="studioDrawerToggle" class="studio-backdrop" aria-hidden="true"></label>
        <aside class="studio-panel" aria-label="Camera Controls & Guide">
          <div class="studio-popover-head">
            <div class="studio-popover-head-left">
              <span class="studio-popover-title" data-t="settingsTitle"></span>
              <span class="match-pill" id="vfMatchPill"><strong id="vfMatchScore">100%</strong></span>
            </div>
            <label for="studioDrawerToggle" class="studio-close-btn" role="button" aria-label="Close">✕</label>
          </div>

          <div class="quick-bar">
            <div class="mini-seg" role="tablist">
              <button type="button" class="mseg selected" data-mode="A" data-t="modeA"></button>
              <button type="button" class="mseg" data-mode="B" data-t="modeB"></button>
              <button type="button" class="mseg" data-mode="C" data-t="modeC"></button>
            </div>
            <div class="quick-toggles">
              <button type="button" class="qchip cam-pill-btn" id="toggleCamBtn">
                <span data-icon="camera"></span><span id="toggleCamLabel" data-t="dockCamOn"></span>
              </button>
              <button type="button" class="qchip story-pill-btn" id="exportStoryBtn">
                <span data-icon="spark"></span><span data-t="dockStory"></span>
              </button>
              <button type="button" class="scan-pill-btn" id="vfScanBtn">
                <span data-icon="scan"></span><span data-t="scanAction"></span>
              </button>
              <label class="qchip upload-pill-btn" for="uploadSceneInput">
                <span data-icon="upload"></span><span data-t="dockPhoto"></span>
              </label>
              <input type="file" id="uploadSceneInput" accept="image/jpeg,image/png,image/webp" class="sr-only">
              <button type="button" class="qchip voice-pill-btn" id="speakCueBtn">
                <span data-icon="volume"></span><span data-t="dockVoice"></span>
              </button>
              <button type="button" class="qchip helper-pill-btn" id="helperModeBtn" aria-label="10s Helper Card">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span data-t="helperTitle"></span>
              </button>
              <label class="qchip"><span data-t="timer"></span> <select id="timerDelay"><option value="0" data-t="off"></option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select></label>
              <button type="button" class="qchip active" id="btnFlip180"><span data-t="flipShort"></span></button>
              <button type="button" class="qhelp" id="flipHelpBtn" aria-label="What is Flip Phone 180°?">?</button>
              <button type="button" class="qchip active" id="btnFrontFoot"><span data-t="footShort"></span></button>
              <button type="button" class="qchip" id="btnLensCycle">1×</button>
              <button type="button" class="qchip" id="btnDistCycle">최적</button>
            </div>
          </div>

          <div class="guide-panel">
            <img id="guidePhoto" alt="">
            <div class="guide-meta">
              <h1 id="guideTitle"></h1>
              <ol id="guideSteps"></ol>
            </div>
          </div>
        </aside>

        <!-- Bottom Gradient Overlay: Mode B Steps -> Live Cue -> Pose Strip -> Shutter Bar -->
        <div class="vf-bottom-dock">
          <!-- Mode B: 3 tiny pills -->
          <div class="vf-steps hidden" id="vfModeBStrip"></div>

          <!-- Single-Line Live Cue -->
          <div class="vf-cue">
            <p id="vfDirText"></p>
          </div>

          <!-- Collapsible Horizontal Pose Picker (1 active pill -> tap to swipe & select) -->
          <div class="pose-picker">
            <input type="checkbox" id="poseStripToggle" class="sr-only" aria-hidden="true">
            <div class="dark-pose-strip" id="poseStrip"></div>
            <label for="poseStripToggle" class="pose-expand-cover" aria-label="Change pose mode"></label>
            <label for="poseStripToggle" class="pose-close-chip" aria-label="Close pose selector">✕</label>
          </div>

          <!-- Unified Single-Row Native Shutter & Nav Bar (Explore · Shutter · Saved) -->
          <div class="shutter-bar">
            <button type="button" class="shutter-btn-side shutter-nav-btn" data-tab="nearby">
              <span class="tab-icon-wrap"><span data-icon="pin"></span><i class="notif-dot hidden" id="nearbyDot"></i></span>
              <small data-t="tabNearby"></small>
            </button>

            <button type="button" class="shutter-circle" id="shutterBtn" aria-label="Capture"><span></span></button>

            <button type="button" class="shutter-btn-side shutter-nav-btn" data-tab="saved">
              <span class="tab-icon-wrap"><span data-icon="bookmark"></span><b class="tab-badge hidden" id="saveCount">0</b></span>
              <small data-t="tabSaved"></small>
            </button>
          </div>
        </div>

        <!-- 10s Helper Mode Full Overlay -->
        <div class="vf-helper hidden" id="vfHelperCard">
          <span class="helper-chip">PILK · 10s GUIDE</span>
          <h3 data-t="helperTitle"></h3>
          <div class="helper-box" id="vfHelperSteps"></div>
          <button type="button" class="btn primary" id="closeHelperBtn" data-t="helperClose"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== PAGE 2: EXPLORE (NEARBY & SPOTS) ==================== -->
  <section class="tab-page" id="page-nearby" data-page="nearby">
    <div class="page-head">
      <h1 data-t="nearbyHeading"></h1>
      <button type="button" class="btn primary sm" id="rescanBtn">
        <span data-icon="scan"></span><span data-t="rescanBtn"></span>
      </button>
    </div>

    <div class="current-spot-banner">
      <img id="nearbyThumb" src="assets/palace-courtyard.webp" alt="">
      <div class="banner-text">
        <b id="scanSpotTitle">경복궁</b>
        <small id="scanLightTag">자연광 · 180° · 1×</small>
      </div>
    </div>

    <div class="explore-layout">
      <div class="map-column">
        <div class="explore-tools">
          <button class="btn outline sm" id="spotMap" data-t="tabSpots"></button>
          <button class="btn outline sm" id="salonMap" data-t="salons"></button>
          <button class="btn outline sm" id="castingBtn" data-t="casting"></button>
        </div>
        <div class="nearby-map-card">
          <div id="spotPins" hidden aria-label="Spot map"></div>
          <iframe id="nearbyMapFrame" title="Nearby Spot Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
          <div class="map-bar">
            <span class="map-label" id="nearbyMapLabel">📍 경복궁</span>
            <a class="map-ext-link" id="nearbyMapLink" href="#" target="_blank" rel="noopener noreferrer" data-t="openBigMap"></a>
          </div>
        </div>

        <section id="castingResults" aria-live="polite" hidden></section>
        <details class="deals">
          <summary data-t="deals"></summary>
          <div class="nearby-stack" id="nearbyList"></div>
          <p class="coupon-disclaimer" data-t="couponDisclaimer"></p>
        </details>
      </div>

      <div class="spots-column">
        <div class="page-head">
          <h1 data-t="spotsHeading"></h1>
          <label class="search-pill">
            <span data-icon="search"></span>
            <input id="searchInput" type="search" data-placeholder="searchPlaceholder">
          </label>
        </div>

        <div class="pill-scroll filter-row">
          <button type="button" class="filter-chip selected" data-filter="all"><span data-t="filterAll"></span></button>
          <button type="button" class="filter-chip" data-filter="insta"><span data-t="filterInsta"></span></button>
          <button type="button" class="filter-chip" data-filter="tiktok"><span data-t="filterTiktok"></span></button>
          <button type="button" class="filter-chip" data-filter="drama"><span data-t="filterDrama"></span></button>
          <button type="button" class="filter-chip" data-filter="heritage"><span data-t="filterHeritage"></span></button>
          <button type="button" class="filter-chip" data-filter="nature"><span data-t="filterNature"></span></button>
        </div>

        <div class="spot-grid" id="spotGrid"></div>
        <div class="more-wrap">
          <button type="button" class="btn outline sm" id="loadMoreBtn"></button>
        </div>
        <p class="empty-msg hidden" id="emptySearch" data-t="emptySearch"></p>
      </div>
    </div>
  </section>

  <!-- ==================== PAGE 3: SAVED & SETTINGS ==================== -->
  <section class="tab-page" id="page-saved" data-page="saved">
    <div class="page-head">
      <h1 data-t="savedHeading"></h1>
    </div>

    <div id="savedContent"></div>

    <div class="settings-card">
      <h3 data-t="settingsTitle"></h3>
      <div class="setting-row setting-lang-row">
        <span>Language · 언어 · 言語</span>
        <div class="lang-pill" role="group" aria-label="Language">
          <button type="button" id="lang-ko" class="selected" aria-pressed="true">KR</button>
          <button type="button" id="lang-en" aria-pressed="false">EN</button>
          <button type="button" id="lang-ja" aria-pressed="false">JP</button>
        </div>
      </div>
      <label class="setting-row">
        <span data-t="opacityLabel"></span>
        <div class="range-wrap">
          <input type="range" id="opacitySlider" min="15" max="100" value="72">
          <b id="opacityVal">72%</b>
        </div>
      </label>
      <label class="setting-row">
        <span data-t="gridLabel"></span>
        <input type="checkbox" id="gridToggle" checked>
      </label>
    </div>

    <div class="settings-card">
      <h3 data-t="infoTitle"></h3>
      <button type="button" class="info-link-row" id="openCreditsBtn">
        <span data-t="footerCredits"></span><span>↗</span>
      </button>
    </div>
  </section>

</main>

<!-- FLOATING GLASSMORPHISM BOTTOM TAB BAR (MOBILE: SHOWN ON EXPLORE / SAVED PAGES) -->
<nav class="bottom-tabs" aria-label="App Navigation">
  <button type="button" class="btab active" data-tab="camera">
    <span data-icon="camera"></span><span data-t="tabCam"></span>
  </button>
  <button type="button" class="btab" data-tab="nearby">
    <span data-icon="pin"></span><span data-t="tabNearby"></span>
  </button>
  <button type="button" class="btab" data-tab="saved">
    <span data-icon="bookmark"></span><span data-t="tabSaved"></span>
  </button>
</nav>

<dialog id="modal">
  <button type="button" class="modal-close" id="closeModal" aria-label="Close">✕</button>
  <div id="modalContent"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="spots-data.js?v=14"></script>
<script src="pilk-data.js?v=17"></script>
<script src="assets/leaflet/leaflet.js"></script>
<script src="explore-map.js?v=14"></script>
<script src="poses.js"></script>
<script src="casting-listings.js"></script>
<script src="studio.js?v=14"></script>
<script src="pose-tracking.js?v=15"></script>
<script src="scene-meter.js?v=16"></script>
<script src="app.js?v=18"></script>
<script>
(() => {
  const toggle = document.getElementById('poseStripToggle');
  const strip = document.getElementById('poseStrip');
  if (!toggle || !strip) return;
  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      requestAnimationFrame(() => {
        strip.querySelector('.dpose.selected')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      });
    }
  });
  document.addEventListener('click', e => {
    if (!toggle.checked) return;
    if (e.target.closest('#poseStrip .dpose') || !e.target.closest('.pose-picker')) {
      toggle.checked = false;
    }
  });
})();
</script>
</body>
</html>
